<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0c1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kennywood">
<title>Kennywood Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: full-bleed 3D night map; glass controls float at the edges; one bottom sheet holds lists, place details and navigation. */
:root {
  --night: #0d0c1d;
  --glass: rgba(20, 18, 40, 0.78);
  --glass-hi: rgba(36, 32, 66, 0.92);
  --line: rgba(236, 226, 255, 0.12);
  --text: #f6efe4;
  --muted: #aaa3c2;
  --lamp: #ffc35c;
  --lamp-ink: #2a1a00;
  --go: #63e08a;
  --warn: #ffb13d;
  --bad: #ff5d5d;
  --haunt: #9cf5c4;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--text); font: 15px/1.4 var(--font-body); overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
[hidden] { display: none !important; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#pins { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

/* ---------- map pins: outer is a zero-size anchor at the projected ground point ---------- */
.pin { position: absolute; left: 0; top: 0; width: 0; height: 0; padding: 0; will-change: transform; pointer-events: none; }
.pin.off { display: none; }
.pin-in { position: absolute; left: 0; bottom: -6px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
.lbl { pointer-events: auto; display: flex; align-items: center; gap: 6px; white-space: nowrap; padding: 4px 9px 4px 10px; border-radius: 999px;
  background: rgba(16, 14, 34, 0.86); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); font: 700 12.5px/1.15 var(--font-body);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.lbl .wt:empty { display: none; }
.wt { font: 800 12px/1 var(--font-display); letter-spacing: 0.02em; padding: 3px 6px 2px; border-radius: 6px; background: var(--wc, #555); color: #120c00; font-variant-numeric: tabular-nums; }
.stem { width: 2px; height: 12px; background: linear-gradient(var(--c), transparent); opacity: 0.9; }
.dot { pointer-events: auto; width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 2px solid #fff; box-shadow: 0 0 0 3px rgba(0,0,0,0.35), 0 0 14px var(--c);
  display: grid; place-items: center; font: 900 8px/1 var(--font-body); color: #111; }
.pin.nolabel .lbl, .pin.nolabel .stem { visibility: hidden; pointer-events: none; }
.pin.t-ride .dot { width: 14px; height: 14px; margin-bottom: -1px; }
.pin.mini .dot { width: 8px; height: 8px; border-width: 1.5px; margin-bottom: 2px; }
.pin.t-restroom .dot { background: #5aa9ff; width: 16px; height: 16px; margin-bottom: -2px; font-size: 7.5px; color: #04203d; border-width: 1.5px; }
.pin.t-haunt .lbl, .pin.t-scare .lbl { background: rgba(10, 24, 18, 0.88); font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; }
.pin.done .lbl { opacity: 0.62; }
.pin.done .nm { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--go); }
.pin.done .dot { background: var(--go); }
.pin.done .dot::after { content: "✓"; font-size: 9px; color: #062b12; }
.pin.closed .dot { filter: saturate(0.25) brightness(0.8); }
.pin.sel { z-index: 5; }
.pin.sel .lbl { background: var(--glass-hi); border-color: var(--lamp); }
.pin.sel .dot { animation: ping 1.6s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 80%, transparent), 0 0 14px var(--c); } 100% { box-shadow: 0 0 0 16px transparent, 0 0 14px var(--c); } }
.pin.dim { opacity: 0.25; }

/* ---------- top bar ---------- */
.top { position: fixed; left: 0; right: 0; top: 0; padding: calc(var(--safe-t) + 10px) max(12px, var(--safe-r)) 0 max(12px, var(--safe-l)); display: flex; gap: 10px; align-items: center; z-index: 20; pointer-events: none; }
.top > * { pointer-events: auto; }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 8px 0 14px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
.search svg { flex: none; opacity: 0.7; }
.search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; color: var(--text); font: 16px var(--font-body); outline: none; }
.search input::placeholder { color: var(--muted); }
.brand { font: 900 13px/1 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--lamp); white-space: nowrap; }
.prog { position: relative; width: 52px; height: 48px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); display: grid; place-items: center; flex: none; }
.prog svg { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); }
.prog b { font: 900 15px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.prog small { display: block; font: 700 8px/1 var(--font-body); color: var(--muted); letter-spacing: 0.06em; text-align: center; margin-top: 1px; }

.results { position: fixed; z-index: 21; top: calc(var(--safe-t) + 64px); left: max(12px, var(--safe-l)); right: max(12px, var(--safe-r)); max-height: 56vh; overflow: auto; border-radius: var(--r);
  background: var(--glass-hi); border: 1px solid var(--line); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); padding: 6px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }

/* ---------- floating buttons ---------- */
.fabs { position: fixed; z-index: 15; right: max(12px, var(--safe-r)); top: calc(var(--safe-t) + 70px); display: flex; flex-direction: column; gap: 8px; }
.fab { width: 46px; height: 46px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  display: grid; place-items: center; font: 900 15px/1 var(--font-display); letter-spacing: 0.04em; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
.navigating .fabs { top: calc(var(--safe-t) + 116px); }
.fab.on { background: var(--lamp); color: var(--lamp-ink); border-color: transparent; }
.fab.heading { background: #5aa9ff; color: #04203d; }
#compassBtn svg { transition: transform 0.1s linear; }

/* ---------- bottom sheet ---------- */
.sheet { position: fixed; z-index: 18; left: 0; right: 0; bottom: 0; padding: 8px max(14px, var(--safe-r)) calc(var(--safe-b) + 12px) max(14px, var(--safe-l));
  background: var(--glass); border-top: 1px solid var(--line); border-radius: 24px 24px 0 0; -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  box-shadow: 0 -16px 40px rgba(0,0,0,0.4); max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; max-height: 78vh; transition: transform 0.28s cubic-bezier(.2,.8,.2,1); }
@media (min-width: 700px) { .sheet { left: 16px; right: auto; width: 400px; bottom: 16px; border-radius: 24px; border: 1px solid var(--line); } }
.grab { align-self: center; width: 44px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.25); margin: 2px 0 10px; flex: none; }
.grab-btn { align-self: stretch; display: flex; justify-content: center; padding: 0; }
.eyebrow { font: 700 11px/1 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
h2.big { margin: 4px 0 2px; font: 900 32px/0.95 var(--font-display); letter-spacing: 0.01em; text-wrap: balance; }
.row { display: flex; align-items: center; gap: 10px; }
.meta { color: var(--muted); font-size: 14px; }
.meta b { color: var(--text); }
.btn { height: 46px; padding: 0 18px; border-radius: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,0.08); border: 1px solid var(--line); white-space: nowrap; }
.btn.primary { background: var(--lamp); color: var(--lamp-ink); border-color: transparent; box-shadow: 0 6px 24px rgba(255, 195, 92, 0.35); }
.btn.good { background: var(--go); color: #062b12; border-color: transparent; }
.btn.grow { flex: 1; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); font-weight: 700; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--text); color: #15122a; }
.chip .n { font: 800 12px/1 var(--font-display); opacity: 0.7; font-variant-numeric: tabular-nums; }
.next { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 12px 12px 14px; border-radius: 18px; background: linear-gradient(135deg, rgba(255,195,92,0.16), rgba(255,195,92,0.04)); border: 1px solid rgba(255,195,92,0.28); margin-bottom: 10px; text-align: left; width: 100%; }
.next .nm { font: 900 24px/1 var(--font-display); }
.list { overflow-y: auto; margin: 6px -6px 0; padding: 0 6px; -webkit-overflow-scrolling: touch; flex: 1; min-height: 0; }
.item { display: grid; grid-template-columns: 10px 1fr auto 44px; align-items: center; gap: 10px; padding: 9px 2px 9px 4px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.item .sw { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.item .t { min-width: 0; }
.item .t b { display: block; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .t span { font-size: 12.5px; color: var(--muted); }
.item.done .t b { text-decoration: line-through; text-decoration-color: var(--go); text-decoration-thickness: 2px; color: var(--muted); }
.item .wt { font-size: 14px; padding: 5px 7px 4px; min-width: 40px; text-align: center; }
.tick { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); display: grid; place-items: center; }
.tick svg { opacity: 0; transform: scale(0.6); transition: 0.18s; }
.done .tick, .tick.on { background: var(--go); border-color: var(--go); }
.done .tick svg, .tick.on svg { opacity: 1; transform: none; }
.sec { padding: 14px 4px 4px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--sc, #888); box-shadow: 0 0 8px var(--sc, #888); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
.tag { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 8px; background: rgba(255,255,255,0.07); border: 1px solid var(--line); }
.tag.area { background: color-mix(in srgb, var(--c) 22%, transparent); border-color: color-mix(in srgb, var(--c) 50%, transparent); }
.bigwait { text-align: center; min-width: 74px; padding: 8px 10px 6px; border-radius: 14px; background: var(--wc, rgba(255,255,255,0.08)); color: #120c00; }
.bigwait b { display: block; font: 900 34px/0.9 var(--font-display); font-variant-numeric: tabular-nums; }
.bigwait small { font-size: 11px; font-weight: 700; }
.bigwait.na { color: var(--text); }
.x { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.08); display: grid; place-items: center; flex: none; }
.fine { font-size: 12px; color: var(--muted); }
.fine a { color: var(--lamp); }

/* ---------- navigation banner ---------- */
.navtop { position: fixed; z-index: 22; top: calc(var(--safe-t) + 10px); left: max(12px, var(--safe-l)); right: max(12px, var(--safe-r)); display: grid; grid-template-columns: 60px 1fr; gap: 12px; align-items: center;
  padding: 12px 14px; border-radius: 20px; background: linear-gradient(135deg, #ffcb6b, #ffab2e); color: #231400; box-shadow: 0 16px 40px rgba(255, 170, 40, 0.35), 0 8px 20px rgba(0,0,0,0.4); max-width: 640px; margin: 0 auto; }
.navtop .arrow { width: 60px; height: 60px; border-radius: 16px; background: rgba(35, 20, 0, 0.12); display: grid; place-items: center; }
.navtop .arrow svg { transition: transform 0.25s ease-out; }
.navtop h3 { margin: 0; font: 900 26px/1 var(--font-display); }
.navtop p { margin: 3px 0 0; font-weight: 700; font-size: 14px; opacity: 0.85; }

#toast { position: fixed; z-index: 40; left: 50%; top: calc(var(--safe-t) + 70px); transform: translate(-50%, -20px); opacity: 0; transition: 0.3s; padding: 10px 16px; border-radius: 14px; background: var(--glass-hi); border: 1px solid var(--line); font-weight: 700; font-size: 14px; max-width: calc(100% - 32px); text-align: center; pointer-events: none; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.burst { position: fixed; z-index: 30; pointer-events: none; font: 900 22px/1 var(--font-display); color: var(--go); text-shadow: 0 0 18px rgba(99,224,138,0.8); animation: rise 1.2s ease-out forwards; }
@keyframes rise { from { transform: translate(-50%, 0) scale(0.6); opacity: 0; } 20% { opacity: 1; transform: translate(-50%, -12px) scale(1.1); } to { transform: translate(-50%, -70px) scale(1); opacity: 0; } }
#loader { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--night); transition: opacity 0.6s; }
#loader.gone { opacity: 0; pointer-events: none; }
#loader h1 { font: 900 clamp(44px, 14vw, 88px)/0.85 var(--font-display); letter-spacing: 0.02em; text-transform: uppercase; margin: 0; text-align: center; color: var(--lamp); text-shadow: 0 0 40px rgba(255,195,92,0.5); }
#loader p { text-align: center; color: var(--muted); margin: 14px 0 0; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="3D map of Kennywood"></canvas>
<div id="pins"></div>

<header class="top" id="top">
  <label class="search" for="q">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="Search rides, food, haunts">
    <span class="brand" id="brand">Kennywood</span>
  </label>
  <button class="prog" id="progBtn" aria-label="Rides ridden">
    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/><circle id="progArc" cx="20" cy="20" r="17" fill="none" stroke="#63e08a" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 200" transform="rotate(-90 20 20)"/></svg>
    <span><b id="progN">0</b><small id="progD">/0</small></span>
  </button>
</header>
<div class="results" id="results" hidden></div>

<div class="navtop" id="navtop" hidden>
  <div class="arrow"><svg id="navArrow" width="34" height="34" viewBox="0 0 24 24"><path d="M12 2 20 21 12 16.5 4 21Z" fill="#231400"/></svg></div>
  <div><h3 id="navHead">Head north</h3><p id="navSub">—</p></div>
</div>

<div class="fabs">
  <button class="fab" id="locBtn" aria-label="Show my location"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button class="fab" id="compassBtn" aria-label="Point map north"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2 16 12H8Z" fill="#ff5d5d"/><path d="M12 22 8 12h8Z" fill="currentColor" opacity=".7"/></svg></button>
  <button class="fab" id="viewBtn" aria-label="Toggle 2D and 3D">2D</button>
</div>

<section class="sheet" id="sheet" aria-label="Park guide">
  <button class="grab-btn" id="grab" aria-label="Expand or collapse"><span class="grab"></span></button>
  <div id="home"></div>
  <div id="placeView" hidden></div>
  <div id="navView" hidden></div>
</section>

<div id="toast" role="status" aria-live="polite"></div>
<div id="loader"><div><h1>Kenny<br>wood</h1><p>Building the park…</p></div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script id="kw-data" type="application/json">__DATA__</script>
<script type="module">
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const D = JSON.parse(document.getElementById('kw-data').textContent);
const [LAT0, LON0] = D.origin, [MLAT, MLON] = D.m;
const toXZ = (lat, lon) => [(lon - LON0) * MLON, -(lat - LAT0) * MLAT];
const pairs = f => { const o = []; for (let i = 0; i < f.length; i += 2) o.push([f[i], f[i + 1]]); return o; };
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => s.toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9]/g, '');
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

const AREAS = {
  entrance: { name: 'Entrance Plaza', c: '#4d8dff' }, midway: { name: 'Good Time Midway', c: '#ffcf1f' }, lagoon: { name: 'The Lagoon', c: '#35d0d9' },
  steelers: { name: 'Steelers Country', c: '#e2b73c' }, kiddieland: { name: 'Kiddieland', c: '#ff5a3d' }, junction: { name: 'Kennywood Junction', c: '#45c95c' },
  kennyville: { name: 'Kennyville', c: '#ff9433' }, lost: { name: 'Lost Kennywood', c: '#ff47a8' }, lane: { name: 'Kenny Lane', c: '#b085ff' }, area412: { name: 'Area 412', c: '#a6e84f' },
};
const TYPE = { ride: 'Ride', food: 'Food & drink', shop: 'Shop', service: 'Guest services', show: 'Show', haunt: 'Haunt', scare: 'Scare zone', restroom: 'Restroom' };
const placeColor = p => p.type === 'haunt' || p.type === 'scare' ? '#9cf5c4' : p.type === 'restroom' ? '#5aa9ff' : (AREAS[p.area]?.c || '#ddd');

// ---------- places ----------
const places = D.places.map(p => ({ ...p, pos: [p.x, p.z], c: placeColor(p) }));
const groupsByName = {};
for (const p of places) (groupsByName[p.name] ||= []).push(p);
const strikeable = p => p.type === 'ride' || p.type === 'haunt';
const rides = places.filter(p => p.type === 'ride');
const haunts = places.filter(p => p.type === 'haunt');
let ridden = store.get('kw-ridden-v1', {});

// ---------- renderer / scene ----------
const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
let DPR = Math.min(devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a1530, 0.00105);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 9000);
const controls = new MapControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.09;
controls.minDistance = 35; controls.maxDistance = 1200; controls.maxPolarAngle = 1.28;
controls.zoomToCursor = true;
const parkPts = pairs(D.park);
const center = parkPts.reduce((a, p) => [a[0] + p[0] / parkPts.length, a[1] + p[1] / parkPts.length], [0, 0]);
controls.target.set(center[0], 0, center[1]);

{ let down = null; canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; }); canvas.addEventListener('pointerup', e => { if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 6) { closeSearch(); if (selected && !navTarget) deselect(); } down = null; }); }

function refreshAll() {
  for (const p of places) {
    if (p.type !== 'ride' && p.type !== 'haunt') continue;
    const st = status(p), b = badge(st), txt = p.type === 'haunt' && st.k !== 'open' ? '' : (st.k === 'open' && st.wait == null ? '' : b.t);
    if (p.wtEl.textContent !== txt) { p.wtEl.textContent = txt; p.wtEl.style.background = b.c; p.lw = 0; }
    setCls(p, 'closed', st.k === 'closed' || st.k === 'down');
  }
  places.forEach(q => setCls(q, 'done', strikeable(q) && !!ridden[q.id]));
  if (navTarget) updateNav(); else if (selected) { const s = selected; placeView.innerHTML = placeHTML(s); select(s, false); } else { const sc = $('list')?.scrollTop; renderHome(); if (sc && $('list')) $('list').scrollTop = sc; }
  if (!resEl.hidden) runSearch();
  progress(); pinsDirty = true;
}

// ---------- loop ----------
function resize() { renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight); bloom.resolution.set(innerWidth / 2, innerHeight / 2); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); pinsDirty = true; }
addEventListener('resize', resize); resize();
const clock = new THREE.Clock(); let frames = 0, slow = 0, lastCam = new THREE.Matrix4(), t0 = performance.now();
function tick(now) {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  stepFly(now);
  if (me) {
    meShown.lerp(V.set(me[0], 0, me[1]), 0.12); puck.position.copy(meShown);
    const sc = Math.max(1, controls.getDistance() / 260); puck.core.scale.setScalar(sc); puck.dot.scale.setScalar(sc * (1 + 0.08 * Math.sin(t * 3))); puck.cone.scale.setScalar(sc);
    puck.acc.scale.setScalar(Math.max(meAcc, 3)); const pr = (t * 0.6) % 1; puck.ring.scale.setScalar(sc * (3 + pr * 9)); puck.ring.material.opacity = 0.8 * (1 - pr);
    if (heading != null) puck.cone.rotation.y = -heading * Math.PI / 180;
    if (follow && !fly) {
      const dx = meShown.x - controls.target.x, dz = meShown.z - controls.target.z;
      controls.target.x += dx * 0.1; controls.target.z += dz * 0.1; camera.position.x += dx * 0.1; camera.position.z += dz * 0.1;
      if (headingMode && heading != null) { const off = camera.position.clone().sub(controls.target); sph.setFromVector3(off); let want = -heading * Math.PI / 180, d = want - sph.theta; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; sph.theta += d * 0.08; camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sph)); camera.lookAt(controls.target); }
    }
  }
  controls.update();
  sky.position.copy(camera.position);
  waterU.t.value = t; routeU.t.value = t;
  if (!REDUCED) {
    for (const f of spinners) f(t);
    for (const tr of trains) {
      const p = tr.curve.getPointAt(tr.u); const v = 7 + Math.sqrt(Math.max(0, 2 * 9.8 * (tr.hmax - p.y))) * 0.75;
      tr.u = (tr.u + v * dt / tr.len) % 1;
      tr.cars.forEach((car, k) => { const u = (tr.u - k * 3 / tr.len + 1) % 1, u2 = (u + 1.5 / tr.len) % 1; car.position.copy(tr.curve.getPointAt(u)).y += 1; car.lookAt(tr.curve.getPointAt(u2).add(new THREE.Vector3(0, 1, 0))); });
    }
    hauntFx.forEach((h, i) => { h.material.opacity = 0.65 + 0.35 * Math.sin(t * 1.3 + i); });
  }
  // compass needle follows camera azimuth
  sph.setFromVector3(camera.position.clone().sub(controls.target));
  $('compassBtn').firstChild.style.transform = `rotate(${(sph.theta * 180 / Math.PI).toFixed(1)}deg)`;
  if (navRoute) $('navArrow').style.transform = `rotate(${(navRoute.brg + sph.theta * 180 / Math.PI).toFixed(1)}deg)`;
  if (!lastCam.equals(camera.matrixWorld)) { lastCam.copy(camera.matrixWorld); pinsDirty = true; }
  camera.updateMatrixWorld();
  composer.render(dt);
  if (pinsDirty) { layoutPins(); pinsDirty = false; }
  // adaptive quality: drop bloom and shadows on slow phones
  frames++; if (frames > 40 && frames < 200) { if (dt > 0.034) slow++; if (frames === 199 && slow > 80) { bloom.enabled = false; renderer.shadowMap.enabled = false; DPR = Math.min(DPR, 1.5); renderer.setPixelRatio(DPR); resize(); } }
  requestAnimationFrame(tick);
}

// intro: drop in from above, then settle at a three-quarter view
camera.position.set(center[0] + 40, 1300, center[1] + 300); camera.lookAt(controls.target);
renderHome(); progress();
document.fonts?.ready.then(() => { places.forEach(p => { p.lw = 0; }); pinsDirty = true; });
requestAnimationFrame(tick);
setTimeout(() => { $('loader').classList.add('gone'); flyTo(center, innerWidth < innerHeight ? 720 : 560, 0.92, -0.62, 2600); }, 250);
startGeo();
fetchLive(); setInterval(fetchLive, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - liveAt > 45000) fetchLive(); });
window.__kw = { places, camera, controls, layoutPins, select, startNav, onPos, status, routeTo: p => walkInfo(p), get field() { return field; } };
</script>
